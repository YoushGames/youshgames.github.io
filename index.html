<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoush Games</title>
<meta name="description" content="Yoush Games — handcrafted mobile games. Privacy policies for our titles.">
<meta name="theme-color" content="#0a0504">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root{
    color-scheme:dark;
    --bg:#060303; --ember:#3d1009; --red:#e5161a; --orange:#ec5a12;
    --ink:#f6ece6; --ink-soft:#a8958c; --ink-faint:#6e5d55;
    --card:rgba(255,255,255,.035); --line:rgba(236,90,18,.18);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; min-height:100vh; padding:56px 16px 40px;
    display:flex; flex-direction:column; align-items:center;
    background-color:var(--bg);
    background-image:radial-gradient(70% 55% at 50% 22%, var(--ember) 0%, #1a0705 42%, var(--bg) 78%);
    background-attachment:fixed;
    color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{width:100%; max-width:560px; flex:1; display:flex; flex-direction:column}

  header{text-align:center; margin-bottom:44px; animation:rise .9s ease-out both}
  h1{margin:0; line-height:0}
  .logo{
    width:min(340px,72vw); height:auto;
    filter:drop-shadow(0 0 28px rgba(229,40,20,.35));
    animation:glow 6s ease-in-out infinite;
  }
  .tag{
    margin:22px 0 0; color:var(--ink-soft);
    font-size:13px; letter-spacing:.32em; text-transform:uppercase;
  }

  main{animation:rise .9s .15s ease-out both}
  h2{
    display:flex; align-items:center; gap:14px;
    margin:0 0 16px; color:var(--ink-faint);
    font-size:12px; font-weight:600; letter-spacing:.24em; text-transform:uppercase;
  }
  h2::before,h2::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent)}

  .games{list-style:none; margin:0; padding:0; display:grid; gap:12px}
  .game{
    position:relative; display:flex; align-items:center; gap:16px;
    padding:16px 18px; border-radius:16px;
    background:var(--card); border:1px solid var(--line);
    color:inherit; text-decoration:none;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .game:hover,.game:focus-visible{
    transform:translateY(-2px);
    border-color:rgba(236,90,18,.55);
    background:rgba(236,90,18,.06);
    box-shadow:0 10px 34px -12px rgba(229,40,20,.55);
    outline:none;
  }
  .g-icon{
    flex:none; width:52px; height:52px; border-radius:13px; object-fit:cover;
    box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 16px -6px rgba(0,0,0,.8);
    transition:box-shadow .25s ease;
  }
  .game:hover .g-icon,.game:focus-visible .g-icon{
    box-shadow:0 0 0 1px rgba(236,90,18,.45),0 6px 20px -6px rgba(229,40,20,.6);
  }
  .g-text{flex:1; min-width:0}
  .g-name{display:block; font-weight:700; font-size:18px; color:var(--ink)}
  .g-link{display:block; font-size:13.5px; color:var(--ink-soft)}
  .arrow{
    flex:none; color:var(--orange); font-size:20px;
    transition:transform .25s ease;
  }
  .game:hover .arrow,.game:focus-visible .arrow{transform:translateX(4px)}

  footer{
    margin-top:56px; text-align:center; color:var(--ink-faint); font-size:12.5px;
    animation:rise .9s .3s ease-out both;
  }
  footer a{color:var(--ink-soft); text-decoration:none; border-bottom:1px solid rgba(168,149,140,.35)}
  footer a:hover{color:var(--ink); border-bottom-color:var(--orange)}

  @keyframes rise{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  @keyframes glow{
    0%,100%{filter:drop-shadow(0 0 22px rgba(229,40,20,.28))}
    50%{filter:drop-shadow(0 0 38px rgba(236,90,18,.5))}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
  }
  @media (max-width:420px){
    body{padding-top:40px}
    header{margin-bottom:34px}
    .game{padding:14px; gap:14px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1><img class="logo" src="assets/yoush-logo.png" width="720" height="444" alt="Yoush Games"></h1>
      <p class="tag">Handcrafted mobile games</p>
    </header>

    <main>
      <h2>Our games</h2>
      <ul class="games">
        <li>
          <a class="game" href="paintpool/">
            <img class="g-icon" src="assets/games/paintpool.webp" width="144" height="144" alt="">
            <span class="g-text">
              <span class="g-name">Paint Pool</span>
              <span class="g-link">Privacy policy</span>
            </span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a class="game" href="defensetime/">
            <img class="g-icon" src="assets/games/defensetime.webp" width="144" height="144" alt="">
            <span class="g-text">
              <span class="g-name">Defense Time</span>
              <span class="g-link">Privacy policy</span>
            </span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
        <li>
          <a class="game" href="eternaltrain/">
            <img class="g-icon" src="assets/games/eternaltrain.webp" width="144" height="144" alt="">
            <span class="g-text">
              <span class="g-name">Eternal Train</span>
              <span class="g-link">Privacy policy</span>
            </span>
            <span class="arrow" aria-hidden="true">&rarr;</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>&copy; 2026 Yoush Games &middot; <a href="mailto:youshgamestudio@gmail.com">youshgamestudio@gmail.com</a></footer>
  </div>
</body>
</html>
